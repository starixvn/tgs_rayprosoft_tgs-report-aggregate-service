apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "report-aggregate-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}",
        "RedisConfigurationString": "{{ .Values.connectionStrings.redis }}",
        "Nats": "{{ .Values.nats.urls }}",
        "RabbitMQ": "{{ .Values.rabbit.url }}"
      }
    }
